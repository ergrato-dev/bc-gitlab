# Proveedor de paneles. Grafana carga cualquier .json de este directorio.
# Los paneles del bootcamp los construyes tú en la Semana 21 y los exportas aquí.
apiVersion: 1

providers:
  - name: bootcamp
    orgId: 1
    folder: Bootcamp GitLab
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
