<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="titulo desc">
  <title id="titulo">El recorrido de un despliegue</title>
  <desc id="desc">Un job de infra/entornos descarga el paquete app.tgz del registro de paquetes de app por su SHA y abre una conexión SSH con el destino, comprobando su huella con DESTINO_KNOWN_HOSTS. El paquete viaja por la entrada estándar. En el destino, authorized_keys fuerza el comando desplegar con el patrón de entornos de esa clave; desplegar descomprime en versiones/SHA y cambia el enlace actual de forma atómica. El servidor Node atiende localhost:8095/entorno/ e importa src/http.ts de la versión a la que apunta actual.</desc>
  <rect width="900" height="430" fill="#1F1F1F"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC6D26"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="30" y="40" fill="#FC6D26" font-size="15" font-weight="600">GitLab</text>
    <rect x="30" y="60" width="250" height="70" rx="6" fill="#554488"/>
    <text x="155" y="90" fill="#FAFAFA" font-size="13" font-weight="600" text-anchor="middle">Registro de paquetes de app</text>
    <text x="155" y="112" fill="#FAFAFA" font-size="12" text-anchor="middle">app/&lt;SHA&gt;/app.tgz</text>
    <rect x="30" y="200" width="250" height="90" rx="6" fill="#2B2B2B" stroke="#A8A8A8"/>
    <text x="155" y="228" fill="#FAFAFA" font-size="13" font-weight="600" text-anchor="middle">Job desplegar (infra/entornos)</text>
    <text x="155" y="250" fill="#A8A8A8" font-size="12" text-anchor="middle">DEPLOY_SSH_KEY del entorno</text>
    <text x="155" y="270" fill="#A8A8A8" font-size="12" text-anchor="middle">DESTINO_KNOWN_HOSTS</text>
    <line x1="155" y1="134" x2="155" y2="196" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="165" y="170" fill="#FAFAFA" font-size="12">JOB-TOKEN · por APP_SHA</text>

    <line x1="284" y1="245" x2="396" y2="245" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="292" y="232" fill="#FAFAFA" font-size="12">ssh destino:22</text>
    <text x="292" y="266" fill="#A8A8A8" font-size="11">.tgz por stdin</text>

    <text x="390" y="40" fill="#FC6D26" font-size="15" font-weight="600">Servicio destino</text>
    <rect x="386" y="60" width="494" height="300" rx="6" fill="#262626" stroke="#666666"/>
    <rect x="400" y="200" width="236" height="90" rx="6" fill="#2B2B2B" stroke="#FC6D26"/>
    <text x="518" y="228" fill="#FAFAFA" font-size="13" font-weight="600" text-anchor="middle">sshd + authorized_keys</text>
    <text x="518" y="250" fill="#A8A8A8" font-size="11" text-anchor="middle">command="desplegar staging"</text>
    <text x="518" y="270" fill="#A8A8A8" font-size="11" text-anchor="middle">restrict</text>
    <line x1="638" y1="245" x2="652" y2="245" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <rect x="656" y="200" width="200" height="90" rx="6" fill="#2B2B2B" stroke="#A8A8A8"/>
    <text x="756" y="224" fill="#FAFAFA" font-size="12" text-anchor="middle">/srv/entornos/staging/</text>
    <text x="756" y="246" fill="#FAFAFA" font-size="12" text-anchor="middle">versiones/&lt;SHA&gt;/</text>
    <text x="756" y="268" fill="#FC6D26" font-size="12" text-anchor="middle">actual → versiones/&lt;SHA&gt;</text>
    <rect x="656" y="80" width="200" height="80" rx="6" fill="#554488"/>
    <text x="756" y="108" fill="#FAFAFA" font-size="13" font-weight="600" text-anchor="middle">servidor.mjs</text>
    <text x="756" y="130" fill="#FAFAFA" font-size="11" text-anchor="middle">importa actual/src/http.ts</text>
    <line x1="756" y1="196" x2="756" y2="164" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="652" y1="120" x2="560" y2="120" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="420" y="116" fill="#FAFAFA" font-size="12">localhost:8095</text>
    <text x="420" y="134" fill="#A8A8A8" font-size="12">/staging/salud</text>

    <text x="30" y="395" fill="#FAFAFA" font-size="13">Lo que no puede pasar: una clave fuera de su patrón (exit 3), una huella distinta (ssh se niega),</text>
    <text x="30" y="415" fill="#FAFAFA" font-size="13">ni una petición servida con media versión: el enlace actual cambia con un solo rename.</text>
  </g>
</svg>
