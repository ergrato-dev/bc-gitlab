<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <rect width="800" height="260" fill="#1a1a2e"/>
  <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#e24329">IaC Declarativo vs Scripts Imperativos</text>

  <!-- Imperative side -->
  <rect x="30" y="55" width="340" height="150" rx="8" fill="#16213e" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="200" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f8c8d">Imperativo (semana 09)</text>
  <text x="50" y="100" font-family="monospace" font-size="9" fill="#a0a0a0">curl -X POST .../projects</text>
  <text x="50" y="116" font-family="monospace" font-size="9" fill="#a0a0a0">curl -X POST .../variables</text>
  <text x="50" y="132" font-family="monospace" font-size="9" fill="#a0a0a0">curl -X PUT .../protected_branches</text>
  <text x="50" y="155" font-family="monospace" font-size="8" fill="#e24329">Sin state: ¿ya existe? hay que</text>
  <text x="50" y="169" font-family="monospace" font-size="8" fill="#e24329">consultar antes de cada paso</text>
  <text x="50" y="188" font-family="monospace" font-size="8" fill="#e24329">Correr 2 veces puede duplicar</text>

  <!-- Declarative side -->
  <rect x="430" y="55" width="340" height="150" rx="8" fill="#16213e" stroke="#fc6d26" stroke-width="2"/>
  <text x="600" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fc6d26">Declarativo (esta semana)</text>
  <text x="450" y="100" font-family="monospace" font-size="9" fill="#a0a0a0">resource "gitlab_project" {</text>
  <text x="450" y="116" font-family="monospace" font-size="9" fill="#a0a0a0">  name = "api-pagos"</text>
  <text x="450" y="132" font-family="monospace" font-size="9" fill="#a0a0a0">}</text>
  <text x="450" y="155" font-family="monospace" font-size="8" fill="#554488">State compara deseado vs real</text>
  <text x="450" y="169" font-family="monospace" font-size="8" fill="#554488">plan → apply idempotente</text>
  <text x="450" y="188" font-family="monospace" font-size="8" fill="#554488">Aplicar N veces = mismo resultado</text>

  <text x="400" y="132" text-anchor="middle" font-family="monospace" font-size="16" fill="#555">vs</text>

  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Bootcamp GitLab CE — Semana 13</text>
</svg>
