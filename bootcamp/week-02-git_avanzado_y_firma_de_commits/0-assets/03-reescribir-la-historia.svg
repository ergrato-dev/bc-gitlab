<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Que ocurre al reescribir la historia con rebase interactivo</title>
  <desc id="desc">Antes del rebase la rama apunta a cuatro commits. Despues, Git ha creado commits nuevos con otros SHA y ha movido la rama; los commits viejos siguen existiendo, huerfanos, alcanzables solo por el reflog hasta que el recolector de basura los borre. Las firmas cubrian los SHA viejos, asi que los nuevos salen sin firmar salvo que rebase.gpgSign este activo.</desc>

  <rect width="900" height="430" fill="#1F1F1F"/>

  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
    <marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC6D26"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- ANTES -->
    <text x="30" y="40" fill="#FC6D26" font-size="15" font-weight="600">Antes del rebase</text>

    <circle cx="80"  cy="80" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="80" y="85" fill="#FAFAFA" font-size="11" text-anchor="middle">8f0</text>
    <circle cx="180" cy="80" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="180" y="85" fill="#FAFAFA" font-size="11" text-anchor="middle">3a9</text>
    <circle cx="280" cy="80" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="280" y="85" fill="#FAFAFA" font-size="11" text-anchor="middle">c4e</text>
    <circle cx="380" cy="80" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="380" y="85" fill="#FAFAFA" font-size="11" text-anchor="middle">7b2</text>

    <line x1="96"  y1="80" x2="164" y2="80" stroke="#666666" stroke-width="2"/>
    <line x1="196" y1="80" x2="264" y2="80" stroke="#666666" stroke-width="2"/>
    <line x1="296" y1="80" x2="364" y2="80" stroke="#666666" stroke-width="2"/>

    <text x="180" y="115" fill="#999999" font-size="12" text-anchor="middle">wip</text>
    <text x="280" y="115" fill="#999999" font-size="12" text-anchor="middle">arreglo</text>
    <text x="380" y="115" fill="#999999" font-size="12" text-anchor="middle">typo</text>

    <rect x="350" y="26" width="90" height="28" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="395" y="45" fill="#FC6D26" font-size="13" text-anchor="middle" font-weight="600">main</text>
    <line x1="390" y1="54" x2="384" y2="62" stroke="#FC6D26" stroke-width="2" marker-end="url(#r2)"/>

    <text x="480" y="85" fill="#FAFAFA" font-size="13">Todos firmados:</text>
    <text x="620" y="85" fill="#108548" font-size="13" font-family="monospace">G G G G</text>

    <!-- Operacion -->
    <rect x="30" y="145" width="840" height="40" rx="6" fill="#252525" stroke="#554488" stroke-width="2"/>
    <text x="450" y="171" fill="#FAFAFA" font-size="14" text-anchor="middle" font-family="monospace">git rebase -i --autosquash main</text>

    <!-- DESPUES -->
    <text x="30" y="222" fill="#FC6D26" font-size="15" font-weight="600">Despues del rebase</text>

    <circle cx="80"  cy="262" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="80" y="267" fill="#FAFAFA" font-size="11" text-anchor="middle">8f0</text>
    <circle cx="180" cy="262" r="16" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="180" y="267" fill="#FAFAFA" font-size="11" text-anchor="middle">2f8</text>
    <circle cx="280" cy="262" r="16" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="280" y="267" fill="#FAFAFA" font-size="11" text-anchor="middle">7e1</text>

    <line x1="96"  y1="262" x2="164" y2="262" stroke="#666666" stroke-width="2"/>
    <line x1="196" y1="262" x2="264" y2="262" stroke="#FC6D26" stroke-width="2"/>

    <text x="180" y="297" fill="#FAFAFA" font-size="12" text-anchor="middle">feat(...)</text>
    <text x="280" y="297" fill="#FAFAFA" font-size="12" text-anchor="middle">test(...)</text>

    <rect x="250" y="208" width="90" height="28" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="295" y="227" fill="#FC6D26" font-size="13" text-anchor="middle" font-weight="600">main</text>
    <line x1="290" y1="236" x2="284" y2="244" stroke="#FC6D26" stroke-width="2" marker-end="url(#r2)"/>

    <!-- Huerfanos -->
    <g opacity="0.45">
      <circle cx="480" cy="262" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="480" y="267" fill="#999999" font-size="11" text-anchor="middle">3a9</text>
      <circle cx="560" cy="262" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="560" y="267" fill="#999999" font-size="11" text-anchor="middle">c4e</text>
      <circle cx="640" cy="262" r="16" fill="#2B2B2B" stroke="#666666" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="640" y="267" fill="#999999" font-size="11" text-anchor="middle">7b2</text>
    </g>
    <text x="560" y="300" fill="#999999" font-size="12" text-anchor="middle">huerfanos: solo el reflog llega a ellos</text>
    <text x="560" y="318" fill="#999999" font-size="12" text-anchor="middle">hasta que pase el recolector de basura</text>

    <!-- Aviso de firma -->
    <rect x="30" y="340" width="840" height="70" rx="8" fill="#2B2B2B" stroke="#E24329" stroke-width="2"/>
    <text x="52" y="366" fill="#E24329" font-size="14" font-weight="600">Los commits nuevos tienen otro SHA, y la firma cubria el viejo</text>
    <text x="52" y="390" fill="#FAFAFA" font-size="13">Sin rebase.gpgSign, salen sin firmar y Git no avisa. Comprueba siempre despues: git log --pretty='%h %G? %s'</text>

  </g>
</svg>
