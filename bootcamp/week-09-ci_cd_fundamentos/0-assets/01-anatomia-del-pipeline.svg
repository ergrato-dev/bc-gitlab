<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="titulo desc">
  <title id="titulo">El pipeline de app: tres stages y cuatro jobs</title>
  <desc id="desc">El pipeline de app tiene tres stages en orden: build, test y package. En build, el job build ejecuta npm ci y tsc y sube la caché .npm. En test, el job test lee la caché, ejecuta los tests y publica el informe JUnit y la cobertura; a su lado, el job gobernanza, solo en pipelines de merge request y con allow_failure, ejecuta scripts/gobernanza.sh. En package, el job package ejecuta npm pack y guarda el .tgz como artefacto durante una semana. Un stage no empieza hasta que el anterior termina bien.</desc>
  <rect width="900" height="420" fill="#1F1F1F"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <marker id="flecha-morada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#554488"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="30" y="36" fill="#FC6D26" font-size="16" font-weight="600">Un pipeline por cambio: build → test → package</text>

    <!-- cabeceras de stage -->
    <text x="150" y="80" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">stage build</text>
    <text x="450" y="80" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">stage test</text>
    <text x="750" y="80" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">stage package</text>
    <rect x="40" y="92" width="220" height="230" rx="8" fill="none" stroke="#666666"/>
    <rect x="330" y="92" width="240" height="230" rx="8" fill="none" stroke="#666666"/>
    <rect x="640" y="92" width="220" height="230" rx="8" fill="none" stroke="#666666"/>

    <!-- build -->
    <rect x="60" y="112" width="180" height="78" rx="6" fill="#FC6D26"/>
    <text x="150" y="136" fill="#1F1F1F" font-size="15" font-weight="700" text-anchor="middle">build</text>
    <text x="150" y="157" fill="#1F1F1F" font-size="12" text-anchor="middle">npm ci</text>
    <text x="150" y="175" fill="#1F1F1F" font-size="12" text-anchor="middle">npx tsc (tipos)</text>

    <!-- test -->
    <rect x="350" y="112" width="200" height="78" rx="6" fill="#FC6D26"/>
    <text x="450" y="136" fill="#1F1F1F" font-size="15" font-weight="700" text-anchor="middle">test</text>
    <text x="450" y="157" fill="#1F1F1F" font-size="12" text-anchor="middle">npm ci</text>
    <text x="450" y="175" fill="#1F1F1F" font-size="12" text-anchor="middle">npm run test:ci</text>

    <!-- gobernanza -->
    <rect x="350" y="206" width="200" height="96" rx="6" fill="none" stroke="#E24329" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="450" y="230" fill="#E24329" font-size="15" font-weight="700" text-anchor="middle">gobernanza</text>
    <text x="450" y="251" fill="#FAFAFA" font-size="12" text-anchor="middle">scripts/gobernanza.sh</text>
    <text x="450" y="270" fill="#999999" font-size="12" text-anchor="middle">solo en merge requests</text>
    <text x="450" y="288" fill="#999999" font-size="12" text-anchor="middle">allow_failure: detecta</text>

    <!-- package -->
    <rect x="660" y="112" width="180" height="78" rx="6" fill="#FC6D26"/>
    <text x="750" y="136" fill="#1F1F1F" font-size="15" font-weight="700" text-anchor="middle">package</text>
    <text x="750" y="157" fill="#1F1F1F" font-size="12" text-anchor="middle">npm pack</text>
    <text x="750" y="175" fill="#1F1F1F" font-size="12" text-anchor="middle">→ app-x.y.z.tgz</text>

    <!-- orden de stages -->
    <line x1="262" y1="151" x2="326" y2="151" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="572" y1="151" x2="636" y2="151" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>

    <!-- caché -->
    <rect x="60" y="350" width="180" height="40" rx="6" fill="#554488"/>
    <text x="150" y="375" fill="#FAFAFA" font-size="13" font-weight="600" text-anchor="middle">caché .npm/</text>
    <line x1="150" y1="192" x2="150" y2="346" stroke="#554488" stroke-width="2" marker-end="url(#flecha-morada)"/>
    <text x="160" y="270" fill="#999999" font-size="12">pull-push</text>
    <path d="M 242 366 C 305 366 300 180 346 180" fill="none" stroke="#554488" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#flecha-morada)"/>
    <text x="282" y="300" fill="#999999" font-size="12">pull</text>

    <!-- artefactos -->
    <text x="450" y="345" fill="#FAFAFA" font-size="12" text-anchor="middle">artefacto: informe JUnit + cobertura</text>
    <text x="450" y="363" fill="#999999" font-size="12" text-anchor="middle">GitLab lo lee y lo enseña en la merge request</text>
    <text x="750" y="345" fill="#FAFAFA" font-size="12" text-anchor="middle">artefacto: *.tgz, 1 semana</text>
    <text x="750" y="363" fill="#999999" font-size="12" text-anchor="middle">se descarga por API</text>

    <text x="30" y="405" fill="#999999" font-size="12">Un stage empieza cuando el anterior termina bien. Un fallo con allow_failure deja seguir al pipeline.</text>
  </g>
</svg>
