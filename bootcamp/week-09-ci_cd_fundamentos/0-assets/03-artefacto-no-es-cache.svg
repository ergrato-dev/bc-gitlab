<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Artefacto no es caché</title>
  <desc id="desc">A la izquierda, el artefacto: el job package sube el .tgz a GitLab, que lo guarda hasta su expire_in, se lo da a los jobs de stages siguientes y deja descargarlo por API. Si un artefacto falta, el job que lo necesita falla. A la derecha, la caché: el job build guarda .npm en un volumen del propio runner con una clave hecha con el hash de package-lock.json y el sufijo protected o non_protected; el job test la lee. Si la caché no está, npm ci descarga de internet y el job tarda más, pero da el mismo resultado. La pregunta que decide: si el archivo desapareciera, ¿cambiaría el resultado del pipeline?</desc>
  <rect width="900" height="440" fill="#1F1F1F"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC6D26"/>
    </marker>
    <marker id="flecha-morada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#554488"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="30" y="36" fill="#FC6D26" font-size="16" font-weight="600">Artefacto no es caché</text>
    <line x1="450" y1="60" x2="450" y2="350" stroke="#666666" stroke-dasharray="4 4"/>

    <!-- artefacto -->
    <text x="235" y="72" fill="#FAFAFA" font-size="15" font-weight="700" text-anchor="middle">Artefacto: un resultado</text>
    <rect x="40" y="94" width="150" height="56" rx="6" fill="#FC6D26"/>
    <text x="115" y="118" fill="#1F1F1F" font-size="14" font-weight="700" text-anchor="middle">package</text>
    <text x="115" y="137" fill="#1F1F1F" font-size="12" text-anchor="middle">npm pack</text>
    <rect x="270" y="94" width="160" height="56" rx="6" fill="none" stroke="#FC6D26" stroke-width="2"/>
    <text x="350" y="118" fill="#FAFAFA" font-size="14" font-weight="700" text-anchor="middle">GitLab</text>
    <text x="350" y="137" fill="#999999" font-size="12" text-anchor="middle">hasta expire_in</text>
    <line x1="192" y1="122" x2="266" y2="122" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="229" y="112" fill="#999999" font-size="11" text-anchor="middle">sube</text>

    <line x1="350" y1="152" x2="350" y2="190" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="350" y="208" fill="#FAFAFA" font-size="12" text-anchor="middle">jobs de stages siguientes</text>
    <text x="350" y="226" fill="#FAFAFA" font-size="12" text-anchor="middle">descarga por API</text>
    <text x="350" y="244" fill="#FAFAFA" font-size="12" text-anchor="middle">informes en la merge request</text>

    <text x="40" y="290" fill="#FAFAFA" font-size="13">Garantía: si el job terminó bien, está.</text>
    <text x="40" y="312" fill="#FAFAFA" font-size="13">Si falta, el job que lo necesita falla.</text>
    <text x="40" y="334" fill="#999999" font-size="12">En app: junit.xml, *.tgz</text>

    <!-- cache -->
    <text x="665" y="72" fill="#FAFAFA" font-size="15" font-weight="700" text-anchor="middle">Caché: una descarga ahorrada</text>
    <rect x="480" y="94" width="130" height="56" rx="6" fill="#FC6D26"/>
    <text x="545" y="118" fill="#1F1F1F" font-size="14" font-weight="700" text-anchor="middle">build</text>
    <text x="545" y="137" fill="#1F1F1F" font-size="12" text-anchor="middle">pull-push</text>
    <rect x="730" y="94" width="130" height="56" rx="6" fill="#FC6D26"/>
    <text x="795" y="118" fill="#1F1F1F" font-size="14" font-weight="700" text-anchor="middle">test</text>
    <text x="795" y="137" fill="#1F1F1F" font-size="12" text-anchor="middle">pull</text>
    <rect x="560" y="190" width="220" height="70" rx="6" fill="#554488"/>
    <text x="670" y="214" fill="#FAFAFA" font-size="14" font-weight="700" text-anchor="middle">volumen del runner</text>
    <text x="670" y="234" fill="#FAFAFA" font-size="11" text-anchor="middle">0_package-lock-&lt;hash&gt;</text>
    <text x="670" y="250" fill="#FAFAFA" font-size="11" text-anchor="middle">-protected | -non_protected</text>
    <line x1="560" y1="152" x2="610" y2="186" stroke="#554488" stroke-width="2" marker-end="url(#flecha-morada)"/>
    <line x1="740" y1="188" x2="780" y2="154" stroke="#554488" stroke-width="2" marker-end="url(#flecha-morada)"/>
    <text x="568" y="178" fill="#999999" font-size="11" text-anchor="end">.npm/</text>

    <text x="480" y="290" fill="#FAFAFA" font-size="13">Garantía: ninguna. Puede no estar.</text>
    <text x="480" y="312" fill="#FAFAFA" font-size="13">Si falta, npm ci descarga: más lento, mismo resultado.</text>
    <text x="480" y="334" fill="#999999" font-size="12">En app: .npm/, nunca node_modules/</text>

    <!-- pregunta -->
    <rect x="40" y="366" width="820" height="50" rx="8" fill="none" stroke="#E24329" stroke-width="2"/>
    <text x="450" y="390" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle">Si el archivo desapareciera, ¿cambiaría el resultado del pipeline?</text>
    <text x="450" y="408" fill="#999999" font-size="12" text-anchor="middle">Sí: artefacto. No, solo tardaría más: caché.</text>
  </g>
</svg>
