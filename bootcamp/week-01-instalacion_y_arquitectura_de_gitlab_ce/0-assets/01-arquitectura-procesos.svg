<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitectura interna de GitLab CE</title>
  <desc id="desc">Una peticion entra por Nginx, pasa por Workhorse y llega a Puma. Puma consulta PostgreSQL, Redis y Gitaly. Las operaciones de Git van de Workhorse directamente a Gitaly. Sidekiq consume trabajos de las colas de Redis.</desc>

  <rect width="900" height="470" fill="#1F1F1F"/>

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
    <marker id="flecha-naranja" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC6D26"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- Fila 1: el camino de una peticion web -->
    <rect x="30" y="40" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="100" y="68" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">Cliente</text>
    <text x="100" y="88" fill="#999999" font-size="13" text-anchor="middle">navegador o git</text>

    <rect x="230" y="40" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#554488" stroke-width="2"/>
    <text x="300" y="68" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">Nginx</text>
    <text x="300" y="88" fill="#999999" font-size="13" text-anchor="middle">enruta y estaticos</text>

    <rect x="430" y="40" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#554488" stroke-width="2"/>
    <text x="500" y="68" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">Workhorse</text>
    <text x="500" y="88" fill="#999999" font-size="13" text-anchor="middle">archivos grandes</text>

    <rect x="630" y="40" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="700" y="68" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">Puma</text>
    <text x="700" y="88" fill="#999999" font-size="13" text-anchor="middle">la aplicacion</text>

    <line x1="170" y1="71" x2="222" y2="71" stroke="#888888" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="370" y1="71" x2="422" y2="71" stroke="#888888" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="570" y1="71" x2="622" y2="71" stroke="#888888" stroke-width="2" marker-end="url(#flecha)"/>

    <!-- Fila 2: Sidekiq -->
    <rect x="630" y="190" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="700" y="218" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">Sidekiq</text>
    <text x="700" y="238" fill="#999999" font-size="13" text-anchor="middle">trabajo diferido</text>

    <!-- Fila 3: los servicios de datos -->
    <rect x="230" y="330" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="300" y="358" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="300" y="378" fill="#999999" font-size="13" text-anchor="middle">metadatos</text>

    <rect x="430" y="330" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="500" y="358" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">Redis</text>
    <text x="500" y="378" fill="#999999" font-size="13" text-anchor="middle">cache y colas</text>

    <rect x="630" y="330" width="140" height="62" rx="6" fill="#2B2B2B" stroke="#E24329" stroke-width="2"/>
    <text x="700" y="358" fill="#FAFAFA" font-size="16" font-weight="600" text-anchor="middle">Gitaly</text>
    <text x="700" y="378" fill="#999999" font-size="13" text-anchor="middle">todas las ops de Git</text>
    <text x="700" y="416" fill="#666666" font-size="13" text-anchor="middle">repositorios en disco</text>

    <!-- Puma consulta los tres servicios -->
    <line x1="668" y1="102" x2="330" y2="326" stroke="#888888" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="686" y1="102" x2="510" y2="326" stroke="#888888" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="700" y1="102" x2="700" y2="326" stroke="#888888" stroke-width="2" marker-end="url(#flecha)"/>

    <!-- Redis alimenta a Sidekiq -->
    <line x1="545" y1="330" x2="640" y2="256" stroke="#888888" stroke-width="2" marker-end="url(#flecha)"/>

    <!-- El atajo de Git: Workhorse habla directamente con Gitaly -->
    <path d="M 500 102 L 500 150 L 810 150 L 810 361 L 774 361"
          fill="none" stroke="#FC6D26" stroke-width="2.5"
          stroke-dasharray="7 5" marker-end="url(#flecha-naranja)"/>
    <text x="812" y="140" fill="#FC6D26" font-size="14" font-weight="600" text-anchor="end">git clone / git push</text>

    <!-- Leyenda -->
    <line x1="30" y1="440" x2="70" y2="440" stroke="#888888" stroke-width="2"/>
    <text x="80" y="445" fill="#999999" font-size="13">peticion web</text>
    <line x1="200" y1="440" x2="240" y2="440" stroke="#FC6D26" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="250" y="445" fill="#999999" font-size="13">Git, sin pasar por la aplicacion</text>

  </g>
</svg>
