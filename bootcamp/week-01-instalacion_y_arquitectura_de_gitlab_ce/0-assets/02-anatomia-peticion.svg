<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Anatomia de un git push: donde termina el push y donde nace el pipeline</title>
  <desc id="desc">El push recorre cinco paradas hasta que Gitaly escribe en disco, y ahi termina. Despues, de forma asincrona, un hook encola trabajos en Redis y Sidekiq crea el pipeline. Por eso el pipeline aparece un instante mas tarde.</desc>

  <rect width="900" height="430" fill="#1F1F1F"/>

  <defs>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
    <marker id="f2-verde" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#108548"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- Tramo sincrono -->
    <text x="30" y="42" fill="#FC6D26" font-size="15" font-weight="600">1. Sincrono — mientras tu terminal espera</text>

    <rect x="30" y="60" width="130" height="58" rx="6" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="95" y="86" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">git push</text>
    <text x="95" y="105" fill="#999999" font-size="13" text-anchor="middle">tu terminal</text>

    <rect x="215" y="60" width="130" height="58" rx="6" fill="#2B2B2B" stroke="#554488" stroke-width="2"/>
    <text x="280" y="86" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">Workhorse</text>
    <text x="280" y="105" fill="#999999" font-size="13" text-anchor="middle">o GitLab Shell</text>

    <rect x="400" y="60" width="130" height="58" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="465" y="86" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">Puma</text>
    <text x="465" y="105" fill="#999999" font-size="13" text-anchor="middle">solo autoriza</text>

    <rect x="585" y="60" width="130" height="58" rx="6" fill="#2B2B2B" stroke="#E24329" stroke-width="2"/>
    <text x="650" y="86" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">Gitaly</text>
    <text x="650" y="105" fill="#999999" font-size="13" text-anchor="middle">escribe en disco</text>

    <line x1="160" y1="89" x2="207" y2="89" stroke="#888888" stroke-width="2" marker-end="url(#f2)"/>
    <line x1="345" y1="89" x2="392" y2="89" stroke="#888888" stroke-width="2" marker-end="url(#f2)"/>
    <line x1="530" y1="89" x2="577" y2="89" stroke="#888888" stroke-width="2" marker-end="url(#f2)"/>

    <!-- El punto donde termina el push -->
    <line x1="770" y1="60" x2="770" y2="330" stroke="#108548" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="782" y="86" fill="#108548" font-size="14" font-weight="600">aqui</text>
    <text x="782" y="104" fill="#108548" font-size="14" font-weight="600">termina</text>
    <text x="782" y="122" fill="#108548" font-size="14" font-weight="600">el push</text>
    <line x1="715" y1="89" x2="762" y2="89" stroke="#108548" stroke-width="2" marker-end="url(#f2-verde)"/>

    <!-- Separador -->
    <line x1="30" y1="165" x2="870" y2="165" stroke="#444444" stroke-width="1"/>

    <!-- Tramo asincrono -->
    <text x="30" y="200" fill="#FC6D26" font-size="15" font-weight="600">2. Asincrono — tu ya tienes el prompt de vuelta</text>

    <rect x="30" y="218" width="150" height="58" rx="6" fill="#2B2B2B" stroke="#E24329" stroke-width="2"/>
    <text x="105" y="244" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">hook post-receive</text>
    <text x="105" y="263" fill="#999999" font-size="13" text-anchor="middle">lo dispara Gitaly</text>

    <rect x="245" y="218" width="150" height="58" rx="6" fill="#2B2B2B" stroke="#666666" stroke-width="2"/>
    <text x="320" y="244" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">Redis</text>
    <text x="320" y="263" fill="#999999" font-size="13" text-anchor="middle">cola de trabajos</text>

    <rect x="460" y="218" width="150" height="58" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="535" y="244" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">Sidekiq</text>
    <text x="535" y="263" fill="#999999" font-size="13" text-anchor="middle">los ejecuta</text>

    <rect x="675" y="218" width="150" height="58" rx="6" fill="#2B2B2B" stroke="#108548" stroke-width="2"/>
    <text x="750" y="244" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">pipeline creado</text>
    <text x="750" y="263" fill="#999999" font-size="13" text-anchor="middle">notificaciones, webhooks</text>

    <line x1="180" y1="247" x2="237" y2="247" stroke="#888888" stroke-width="2" marker-end="url(#f2)"/>
    <line x1="395" y1="247" x2="452" y2="247" stroke="#888888" stroke-width="2" marker-end="url(#f2)"/>
    <line x1="610" y1="247" x2="667" y2="247" stroke="#888888" stroke-width="2" marker-end="url(#f2)"/>

    <!-- Enlace entre los dos tramos -->
    <path d="M 650 118 L 650 190 L 105 190 L 105 210"
          fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#f2)"/>

    <!-- La conclusion -->
    <rect x="30" y="330" width="840" height="70" rx="6" fill="#2B2B2B" stroke="#554488" stroke-width="2"/>
    <text x="50" y="358" fill="#FAFAFA" font-size="15" font-weight="600">Por eso el commit aparece al instante y el pipeline tarda un momento.</text>
    <text x="50" y="382" fill="#999999" font-size="14">Si el pipeline no llega nunca, el push funciono: mira Sidekiq y el tamano de sus colas.</text>

  </g>
</svg>
