<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="titulo desc">
  <title id="titulo">El flujo OIDC del laboratorio</title>
  <desc id="desc">Tres actores: navegador, GitLab y Keycloak. Por el navegador, con localhost: 1, pulsar Keycloak en localhost:8888 y ser redirigido con state y code_challenge; 2, iniciar sesión en localhost:8180; 3, volver al callback de GitLab con el code. De servidor a servidor, por la red del compose: 4, GitLab cambia el code por tokens en keycloak:8080 con el secreto y el code_verifier; 5, valida la firma con las claves de keycloak:8080 y comprueba que el emisor del token es http://localhost:8180/realms/bootcamp, fijado por KC_HOSTNAME.</desc>
  <rect width="900" height="440" fill="#1F1F1F"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC6D26"/>
    </marker>
    <marker id="flecha-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8877CC"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <!-- actores -->
    <rect x="40" y="30" width="180" height="56" rx="8" fill="none" stroke="#FC6D26" stroke-width="2"/>
    <text x="130" y="55" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">Navegador</text>
    <text x="130" y="74" fill="#999999" font-size="12" text-anchor="middle">tu máquina</text>

    <rect x="360" y="30" width="180" height="56" rx="8" fill="none" stroke="#FC6D26" stroke-width="2"/>
    <text x="450" y="55" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">GitLab</text>
    <text x="450" y="74" fill="#999999" font-size="12" text-anchor="middle">localhost:8888 · gitlab</text>

    <rect x="680" y="30" width="180" height="56" rx="8" fill="none" stroke="#FC6D26" stroke-width="2"/>
    <text x="770" y="55" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="middle">Keycloak</text>
    <text x="770" y="74" fill="#999999" font-size="12" text-anchor="middle">localhost:8180 · keycloak:8080</text>

    <!-- líneas de vida -->
    <line x1="130" y1="86" x2="130" y2="400" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="450" y1="86" x2="450" y2="400" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="770" y1="86" x2="770" y2="400" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- zona navegador -->
    <text x="40" y="118" fill="#FC6D26" font-size="12" font-weight="600">POR EL NAVEGADOR · localhost</text>

    <line x1="134" y1="140" x2="446" y2="140" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="290" y="132" fill="#FAFAFA" font-size="12" text-anchor="middle">1 · pulsas Keycloak</text>

    <line x1="446" y1="165" x2="766" y2="165" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="608" y="157" fill="#FAFAFA" font-size="12" text-anchor="middle">redirección con state y code_challenge</text>
    <text x="608" y="182" fill="#999999" font-size="11" text-anchor="middle">el navegador la sigue hasta localhost:8180</text>

    <line x1="134" y1="205" x2="766" y2="205" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="450" y="198" fill="#FAFAFA" font-size="12" text-anchor="middle">2 · usuario y contraseña (GitLab no los ve)</text>

    <line x1="766" y1="235" x2="446" y2="235" stroke="#FC6D26" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="608" y="228" fill="#FAFAFA" font-size="12" text-anchor="middle">3 · callback con el code</text>

    <!-- zona servidor -->
    <line x1="30" y1="262" x2="870" y2="262" stroke="#666666" stroke-width="1"/>
    <text x="40" y="285" fill="#8877CC" font-size="12" font-weight="600">DE SERVIDOR A SERVIDOR · red del compose</text>

    <line x1="454" y1="310" x2="766" y2="310" stroke="#8877CC" stroke-width="2" marker-end="url(#flecha-m)"/>
    <text x="608" y="302" fill="#FAFAFA" font-size="12" text-anchor="middle">4 · code + secreto + code_verifier</text>
    <text x="608" y="326" fill="#999999" font-size="11" text-anchor="middle">token_endpoint en keycloak:8080</text>

    <line x1="766" y1="350" x2="454" y2="350" stroke="#8877CC" stroke-width="2" marker-end="url(#flecha-m)"/>
    <text x="608" y="343" fill="#FAFAFA" font-size="12" text-anchor="middle">id_token firmado</text>

    <rect x="250" y="365" width="400" height="46" rx="6" fill="#554488" opacity="0.35"/>
    <text x="450" y="384" fill="#FAFAFA" font-size="12" text-anchor="middle">5 · firma con jwks de keycloak:8080</text>
    <text x="450" y="402" fill="#FAFAFA" font-size="12" text-anchor="middle">iss = http://localhost:8180/realms/bootcamp (KC_HOSTNAME)</text>
  </g>
</svg>
