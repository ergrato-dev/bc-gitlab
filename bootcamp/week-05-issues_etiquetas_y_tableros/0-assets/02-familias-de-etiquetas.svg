<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Las cuatro familias de etiquetas y dónde viven</title>
  <desc id="desc">La taxonomía tiene cuatro familias, cada una contesta una pregunta. tipo contesta qué clase de trabajo es; prioridad, cuánto cuesta no hacerlo; estado, por dónde va. Las tres son exclusivas: un issue lleva como mucho una de cada una, y en tipo exactamente una. Viven en el grupo raíz y las heredan app, infra y ci. La cuarta, area, dice qué parte del producto toca, no es exclusiva y vive en el proyecto app. En CE los dos puntos dobles no imponen exclusividad: la vigila el tablero al mover y una comprobación por API.</desc>
  <rect width="900" height="430" fill="#1F1F1F"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="30" y="38" fill="#FC6D26" font-size="16" font-weight="600">Una familia, una pregunta</text>

    <rect x="30" y="60" width="610" height="250" rx="8" fill="none" stroke="#FC6D26"/>
    <text x="50" y="86" fill="#FC6D26" font-size="13" font-weight="600">Grupo raíz  plataforma-&lt;tu-dominio&gt;  ·  exclusivas</text>

    <text x="50" y="122" fill="#FAFAFA" font-size="13" font-weight="600">tipo::</text>
    <text x="150" y="122" fill="#999999" font-size="12">¿Qué clase de trabajo es?  exactamente una</text>
    <rect x="50" y="132" width="70" height="20" rx="10" fill="#1F75CB"/><text x="62" y="146" fill="#FAFAFA" font-size="11">bug</text>
    <rect x="126" y="132" width="70" height="20" rx="10" fill="#5BA4E5"/><text x="136" y="146" fill="#1F1F1F" font-size="11">feature</text>
    <rect x="202" y="132" width="110" height="20" rx="10" fill="#8FC1EE"/><text x="212" y="146" fill="#1F1F1F" font-size="11">mantenimiento</text>
    <rect x="318" y="132" width="60" height="20" rx="10" fill="#C2DDF6"/><text x="330" y="146" fill="#1F1F1F" font-size="11">docs</text>

    <text x="50" y="188" fill="#FAFAFA" font-size="13" font-weight="600">prioridad::</text>
    <text x="150" y="188" fill="#999999" font-size="12">¿Cuánto cuesta no hacerlo?  como mucho una</text>
    <rect x="50" y="198" width="60" height="20" rx="10" fill="#DD2B0E"/><text x="62" y="212" fill="#FAFAFA" font-size="11">alta</text>
    <rect x="116" y="198" width="66" height="20" rx="10" fill="#E9765A"/><text x="128" y="212" fill="#1F1F1F" font-size="11">media</text>
    <rect x="188" y="198" width="60" height="20" rx="10" fill="#F2B7A8"/><text x="200" y="212" fill="#1F1F1F" font-size="11">baja</text>

    <text x="50" y="254" fill="#FAFAFA" font-size="13" font-weight="600">estado::</text>
    <text x="150" y="254" fill="#999999" font-size="12">¿Por dónde va?  como mucho una · son las columnas del tablero</text>
    <rect x="50" y="264" width="86" height="20" rx="10" fill="#9DD4AE"/><text x="60" y="278" fill="#1F1F1F" font-size="11">preparado</text>
    <rect x="142" y="264" width="80" height="20" rx="10" fill="#52B87A"/><text x="152" y="278" fill="#1F1F1F" font-size="11">en-curso</text>
    <rect x="228" y="264" width="94" height="20" rx="10" fill="#108548"/><text x="238" y="278" fill="#FAFAFA" font-size="11">en-revision</text>
    <rect x="328" y="264" width="86" height="20" rx="10" fill="#554488"/><text x="338" y="278" fill="#FAFAFA" font-size="11">bloqueado</text>

    <text x="680" y="100" fill="#999999" font-size="12">se heredan en</text>
    <line x1="640" y1="120" x2="700" y2="140" stroke="#666666" marker-end="url(#a)"/>
    <line x1="640" y1="185" x2="700" y2="200" stroke="#666666" marker-end="url(#a)"/>
    <line x1="640" y1="250" x2="700" y2="260" stroke="#666666" marker-end="url(#a)"/>
    <rect x="705" y="128" width="160" height="28" rx="6" fill="none" stroke="#666666"/><text x="720" y="147" fill="#FAFAFA" font-size="12">app</text>
    <rect x="705" y="186" width="160" height="28" rx="6" fill="none" stroke="#666666"/><text x="720" y="205" fill="#FAFAFA" font-size="12">infra</text>
    <rect x="705" y="246" width="160" height="28" rx="6" fill="none" stroke="#666666"/><text x="720" y="265" fill="#FAFAFA" font-size="12">ci</text>

    <rect x="30" y="330" width="610" height="70" rx="8" fill="none" stroke="#666666"/>
    <text x="50" y="356" fill="#FAFAFA" font-size="13" font-weight="600">area::</text>
    <text x="150" y="356" fill="#999999" font-size="12">¿Qué parte del producto toca?  varias · vive en el proyecto app</text>
    <rect x="50" y="368" width="90" height="20" rx="10" fill="#666666"/><text x="60" y="382" fill="#FAFAFA" font-size="11">prestamos</text>
    <rect x="146" y="368" width="70" height="20" rx="10" fill="#666666"/><text x="156" y="382" fill="#FAFAFA" font-size="11">multas</text>

    <text x="680" y="350" fill="#E24329" font-size="12" font-weight="600">En CE, :: no impone nada.</text>
    <text x="680" y="370" fill="#FAFAFA" font-size="12">La exclusividad la vigilan</text>
    <text x="680" y="388" fill="#FAFAFA" font-size="12">el tablero y la API.</text>
  </g>
</svg>
