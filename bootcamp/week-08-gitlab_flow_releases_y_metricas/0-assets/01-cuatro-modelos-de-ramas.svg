<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Los cuatro modelos de ramas y las ramas de larga vida de cada uno</title>
  <desc id="desc">GitHub Flow tiene solo main y ramas cortas que vuelven por merge request. Git Flow mantiene main y develop, con ramas de funcionalidad que salen de develop y ramas de release que se fusionan en las dos. Trunk-based integra en main varias veces al día con ramas de horas. GitLab Flow con ramas de release mantiene main y crea release/0.1 desde el tag v0.1.0; el arreglo entra en main y baja a release/0.1 con cherry-pick, y de ahí sale v0.1.1.</desc>
  <rect width="900" height="560" fill="#1F1F1F"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <marker id="flecha-naranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC6D26"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="30" y="36" fill="#FC6D26" font-size="16" font-weight="600">Cuántas ramas de larga vida mantiene cada modelo</text>

    <!-- GitHub Flow -->
    <text x="30" y="92" fill="#FAFAFA" font-size="15" font-weight="600">GitHub Flow</text>
    <text x="30" y="112" fill="#999999" font-size="13">1 rama: main</text>
    <line x1="220" y1="100" x2="870" y2="100" stroke="#FC6D26" stroke-width="3"/>
    <text x="874" y="92" fill="#999999" font-size="13" text-anchor="end">main</text>
    <path d="M 300 100 L 330 70 L 400 70 L 430 100" fill="none" stroke="#666666" stroke-width="2"/>
    <path d="M 520 100 L 550 70 L 620 70 L 650 100" fill="none" stroke="#666666" stroke-width="2"/>
    <circle cx="430" cy="100" r="6" fill="#FC6D26"/>
    <circle cx="650" cy="100" r="6" fill="#FC6D26"/>

    <!-- Git Flow -->
    <text x="30" y="200" fill="#FAFAFA" font-size="15" font-weight="600">Git Flow</text>
    <text x="30" y="220" fill="#999999" font-size="13">2 ramas + 1 por release</text>
    <line x1="220" y1="170" x2="870" y2="170" stroke="#FC6D26" stroke-width="3"/>
    <text x="874" y="162" fill="#999999" font-size="13" text-anchor="end">main</text>
    <line x1="220" y1="240" x2="870" y2="240" stroke="#554488" stroke-width="3"/>
    <text x="874" y="262" fill="#999999" font-size="13" text-anchor="end">develop</text>
    <path d="M 260 240 L 290 270 L 360 270 L 390 240" fill="none" stroke="#666666" stroke-width="2"/>
    <path d="M 480 240 L 510 205 L 600 205" fill="none" stroke="#666666" stroke-width="2"/>
    <line x1="600" y1="205" x2="636" y2="174" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="600" y1="205" x2="636" y2="236" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="555" y="198" fill="#999999" font-size="13" text-anchor="middle">release/*</text>
    <circle cx="640" cy="170" r="6" fill="#FC6D26"/>
    <text x="700" y="198" fill="#E24329" font-size="13">cada arreglo, dos veces</text>

    <!-- Trunk-based -->
    <text x="30" y="330" fill="#FAFAFA" font-size="15" font-weight="600">Trunk-based</text>
    <text x="30" y="350" fill="#999999" font-size="13">1 rama, integración diaria</text>
    <line x1="220" y1="340" x2="870" y2="340" stroke="#FC6D26" stroke-width="3"/>
    <text x="874" y="332" fill="#999999" font-size="13" text-anchor="end">main</text>
    <circle cx="260" cy="340" r="5" fill="#FC6D26"/>
    <circle cx="320" cy="340" r="5" fill="#FC6D26"/>
    <circle cx="380" cy="340" r="5" fill="#FC6D26"/>
    <circle cx="440" cy="340" r="5" fill="#FC6D26"/>
    <circle cx="500" cy="340" r="5" fill="#FC6D26"/>
    <circle cx="560" cy="340" r="5" fill="#FC6D26"/>
    <circle cx="620" cy="340" r="5" fill="#FC6D26"/>
    <circle cx="680" cy="340" r="5" fill="#FC6D26"/>
    <text x="470" y="374" fill="#999999" font-size="13" text-anchor="middle">ramas de horas; lo incompleto, detrás de un feature flag</text>

    <!-- GitLab Flow -->
    <text x="30" y="440" fill="#FAFAFA" font-size="15" font-weight="600">GitLab Flow</text>
    <text x="30" y="460" fill="#999999" font-size="13">main + 1 por versión</text>
    <text x="30" y="478" fill="#999999" font-size="13">mantenida</text>
    <line x1="220" y1="430" x2="870" y2="430" stroke="#FC6D26" stroke-width="3"/>
    <text x="874" y="422" fill="#999999" font-size="13" text-anchor="end">main</text>
    <circle cx="330" cy="430" r="7" fill="#108548"/>
    <text x="330" y="414" fill="#FAFAFA" font-size="13" text-anchor="middle">v0.1.0</text>
    <path d="M 330 430 L 370 500 L 870 500" fill="none" stroke="#554488" stroke-width="3"/>
    <text x="874" y="524" fill="#999999" font-size="13" text-anchor="end">release/0.1</text>
    <circle cx="560" cy="430" r="6" fill="#FC6D26"/>
    <text x="560" y="414" fill="#FAFAFA" font-size="13" text-anchor="middle">fix</text>
    <line x1="560" y1="438" x2="606" y2="492" stroke="#FC6D26" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha-naranja)"/>
    <text x="602" y="462" fill="#FC6D26" font-size="13">cherry-pick -x</text>
    <circle cx="610" cy="500" r="6" fill="#FC6D26"/>
    <circle cx="700" cy="500" r="7" fill="#108548"/>
    <text x="700" y="528" fill="#FAFAFA" font-size="13" text-anchor="middle">v0.1.1</text>
    <text x="616" y="482" fill="#999999" font-size="13">upstream first: main primero</text>
  </g>
</svg>
