<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#1a1a2e"/>
  <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#e24329">GitOps — Reconciliation Loop vs Push-based CI/CD</text>

  <!-- Push based -->
  <rect x="30" y="50" width="340" height="105" rx="8" fill="#16213e" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="200" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f8c8d">Push-based (semanas 05-06)</text>
  <text x="50" y="94" font-family="monospace" font-size="9" fill="#a0a0a0">Pipeline CI → kubectl apply</text>
  <text x="50" y="110" font-family="monospace" font-size="9" fill="#a0a0a0">Credenciales de escritura EN el runner</text>
  <text x="50" y="126" font-family="monospace" font-size="9" fill="#e24329">Sin detección de drift</text>
  <text x="50" y="142" font-family="monospace" font-size="9" fill="#a0a0a0">Runner → clúster (conexión saliente)</text>

  <!-- Pull based -->
  <rect x="430" y="50" width="340" height="105" rx="8" fill="#16213e" stroke="#fc6d26" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fc6d26">Pull-based GitOps (esta semana)</text>
  <text x="450" y="94" font-family="monospace" font-size="9" fill="#a0a0a0">agentk extrae manifiestos de Git</text>
  <text x="450" y="110" font-family="monospace" font-size="9" fill="#a0a0a0">Credenciales viven DENTRO del clúster</text>
  <text x="450" y="126" font-family="monospace" font-size="9" fill="#554488">Drift detectado y corregido solo</text>
  <text x="450" y="142" font-family="monospace" font-size="9" fill="#a0a0a0">Clúster → GitLab (conexión saliente)</text>

  <!-- Loop diagram -->
  <circle cx="400" cy="230" r="55" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#fc6d26">1. leer Git</text>
  <text x="460" y="230" text-anchor="middle" font-family="monospace" font-size="8" fill="#e24329">2. leer clúster</text>
  <text x="400" y="262" text-anchor="middle" font-family="monospace" font-size="8" fill="#554488">3. diff</text>
  <text x="340" y="230" text-anchor="middle" font-family="monospace" font-size="8" fill="#7f8c8d">4. aplicar</text>
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0a0">loop</text>

  <text x="400" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Bootcamp GitLab CE — Semana 13</text>
</svg>
