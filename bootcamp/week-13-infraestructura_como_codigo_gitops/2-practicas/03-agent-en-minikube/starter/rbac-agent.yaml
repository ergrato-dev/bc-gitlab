# ¿QUÉ HACE?: Otorga al Service Account del agent permisos acotados sobre el namespace produccion
# ¿POR QUÉ?: El agent no debe operar con cluster-admin — principio de mínimo privilegio
# ¿PARA QUÉ?: Que un manifiesto malicioso o un token filtrado tengan impacto acotado
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-deployer
  namespace: produccion
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-deployer-binding
  namespace: produccion
subjects:
  - kind: ServiceAccount
    name: minikube-bootcamp
    namespace: gitlab-agent
roleRef:
  kind: Role
  name: gitops-deployer
  apiGroup: rbac.authorization.k8s.io
