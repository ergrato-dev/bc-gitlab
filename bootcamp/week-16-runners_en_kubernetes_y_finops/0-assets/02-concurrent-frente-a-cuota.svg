<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="titulo desc">
  <title id="titulo">concurrent frente a una cuota</title>
  <desc id="desc">Cuatro jobs de test llegan a la vez. Arriba, con concurrent igual a 2, el gestor acepta dos y los otros dos esperan en pending en GitLab; cuando acaban los primeros entran los otros dos y los cuatro terminan en verde. Abajo, con concurrent igual a 6 y una ResourceQuota de 3 pods, el gestor acepta los cuatro, pero Kubernetes rechaza los pods que no caben con exceeded quota y esos jobs fallan con runner_system_failure, sin volver a la cola.</desc>
  <rect width="900" height="400" fill="#1F1F1F"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="30" y="40" fill="#FC6D26" font-size="15" font-weight="600">concurrent = 2</text>
    <rect x="30" y="55" width="160" height="110" rx="6" fill="#2B2B2B" stroke="#666666"/>
    <text x="110" y="100" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle">4 jobs de test</text>
    <text x="110" y="124" fill="#A8A8A8" font-size="13" text-anchor="middle">a la vez</text>
    <rect x="260" y="55" width="190" height="110" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="355" y="92" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle">Gestor</text>
    <text x="355" y="116" fill="#FAFAFA" font-size="13" text-anchor="middle">acepta 2</text>
    <text x="355" y="138" fill="#FAFAFA" font-size="13" text-anchor="middle">2 esperan en pending</text>
    <rect x="520" y="55" width="350" height="110" rx="6" fill="#108548"/>
    <text x="695" y="100" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle">4 en verde</text>
    <text x="695" y="124" fill="#FAFAFA" font-size="13" text-anchor="middle">dos con ~30 s de cola</text>
    <line x1="190" y1="110" x2="256" y2="110" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="450" y1="110" x2="516" y2="110" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>

    <text x="30" y="225" fill="#FC6D26" font-size="15" font-weight="600">concurrent = 6 y ResourceQuota pods=3</text>
    <rect x="30" y="240" width="160" height="110" rx="6" fill="#2B2B2B" stroke="#666666"/>
    <text x="110" y="285" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle">4 jobs de test</text>
    <text x="110" y="309" fill="#A8A8A8" font-size="13" text-anchor="middle">a la vez</text>
    <rect x="260" y="240" width="190" height="110" rx="6" fill="#2B2B2B" stroke="#FC6D26" stroke-width="2"/>
    <text x="355" y="277" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle">Gestor</text>
    <text x="355" y="301" fill="#FAFAFA" font-size="13" text-anchor="middle">acepta los 4</text>
    <text x="355" y="323" fill="#FAFAFA" font-size="13" text-anchor="middle">pide 4 pods</text>
    <rect x="520" y="240" width="350" height="110" rx="6" fill="#2B2B2B" stroke="#E24329" stroke-width="3"/>
    <text x="695" y="277" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle">Kubernetes: exceeded quota</text>
    <text x="695" y="301" fill="#FAFAFA" font-size="13" text-anchor="middle">los que no caben fallan</text>
    <text x="695" y="323" fill="#FAFAFA" font-size="13" text-anchor="middle">runner_system_failure, sin cola</text>
    <line x1="190" y1="295" x2="256" y2="295" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="450" y1="295" x2="516" y2="295" stroke="#666666" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="450" y="385" fill="#A8A8A8" font-size="13" text-anchor="middle">El freno es concurrent; la cuota, muy por encima, es solo un seguro</text>
  </g>
</svg>
