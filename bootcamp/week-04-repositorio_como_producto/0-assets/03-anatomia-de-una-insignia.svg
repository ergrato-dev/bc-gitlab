<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Anatomía de una insignia y por qué los marcadores importan</title>
  <desc id="desc">Una insignia son dos URLs: image_url, la imagen que se muestra, y link_url, a dónde lleva al pulsarla. Escritas con marcadores como project_path y default_branch detrás de la URL de la instancia, GitLab las sustituye al renderizar por los valores actuales del proyecto y devuelve rendered_image_url y rendered_link_url. Escritas a mano producen hoy exactamente la misma URL, pero dejan de funcionar en tres situaciones que no dan ningún aviso: si el proyecto cambia de ruta, si cambia la rama por defecto, o si la insignia se copia a otro proyecto. GitLab genera cuatro SVG por sí mismo: pipeline, coverage, release y custom, y por eso no hace falta ningún servicio externo.</desc>

  <rect width="900" height="460" fill="#1F1F1F"/>

  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#108548"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E24329"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <text x="30" y="38" fill="#FC6D26" font-size="16" font-weight="600">Una insignia son dos URLs, y conviene que ninguna este escrita a mano</text>

    <!-- Con marcadores -->
    <rect x="30" y="64" width="840" height="150" rx="8" fill="#252525" stroke="#108548" stroke-width="2"/>
    <text x="52" y="90" fill="#108548" font-size="14" font-weight="600">Con marcadores — sobrevive</text>

    <text x="52" y="118" fill="#999999" font-size="11">image_url</text>
    <text x="130" y="118" fill="#FAFAFA" font-size="11" font-family="monospace">http://localhost:8888/%{project_path}/badges/%{default_branch}/pipeline.svg</text>
    <text x="52" y="140" fill="#999999" font-size="11">link_url</text>
    <text x="130" y="140" fill="#FAFAFA" font-size="11" font-family="monospace">http://localhost:8888/%{project_path}/-/pipelines</text>

    <line x1="130" y1="156" x2="130" y2="176" stroke="#108548" stroke-width="2" marker-end="url(#b1)"/>
    <text x="146" y="172" fill="#108548" font-size="11">GitLab sustituye al renderizar</text>

    <text x="52" y="196" fill="#999999" font-size="11">rendered</text>
    <text x="130" y="196" fill="#108548" font-size="11" font-family="monospace">http://localhost:8888/plataforma-biblioteca/app/badges/main/pipeline.svg</text>

    <!-- A mano -->
    <rect x="30" y="230" width="840" height="126" rx="8" fill="#252525" stroke="#E24329" stroke-width="2"/>
    <text x="52" y="256" fill="#E24329" font-size="14" font-weight="600">Escrita a mano — hoy da la misma URL, y se rompe sin avisar</text>

    <text x="52" y="284" fill="#999999" font-size="11">image_url</text>
    <text x="130" y="284" fill="#FAFAFA" font-size="11" font-family="monospace">http://localhost:8888/plataforma-biblioteca/app/badges/main/pipeline.svg</text>

    <line x1="130" y1="298" x2="130" y2="316" stroke="#E24329" stroke-width="2" marker-end="url(#b2)"/>

    <text x="146" y="314" fill="#E24329" font-size="11">Se rompe si: cambia la ruta del proyecto · cambia la rama por defecto · se copia a otro proyecto</text>
    <text x="146" y="336" fill="#666666" font-size="11">Ninguna de las tres da aviso: el fallo es una imagen que no carga, y nadie vigila eso.</text>

    <!-- Las que sirve tu instancia -->
    <rect x="30" y="372" width="840" height="60" rx="8" fill="#2B2B2B" stroke="#554488" stroke-width="1"/>
    <text x="52" y="396" fill="#554488" font-size="13" font-weight="600">Los cuatro SVG que genera tu propia instancia — sin salida a internet</text>
    <text x="52" y="418" fill="#FAFAFA" font-size="11" font-family="monospace">badges/&lt;rama&gt;/pipeline.svg · badges/&lt;rama&gt;/coverage.svg · -/badges/release.svg · -/badges/custom.svg</text>
  </g>
</svg>
